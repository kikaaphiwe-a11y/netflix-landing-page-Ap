<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix South Africa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
         <div class="hero-section">
          <div class="navbar">
             <a href="https://www.netflix.com/za/login?">Sign In</a>
          </div>

          <div class="banner-container">
               <h1 class="card-title">Unlimited movies, TV<br>
                   shows, and more.
               </h1>
               <p class="card-subtitle"><strong>Starts at R59. Cancel anytime.</strong></p>

               <form class="email-form">
                <h3 class="email-form-title">Ready to watch? Enter your email to create or restart your membership.</h3>
                 <div class="get-started-form">
                     <input type="text" placeholder="Email Address">
                     <button type="submit">Get Started ></button>
                 </div>
               </form>
          </div> 
     </div>
    
</body>
</html>
